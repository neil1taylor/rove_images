# SUPERSEDED — Phase 1 of Batch 1 (commit 49036a2) brings the
# windows-image-pipeline SA + ClusterRole + ClusterRoleBinding under git
# control at manifests/pipelines/build-namespaces/windows-image-build.yaml
# with a strict superset of the rules below. Do NOT apply this file
# standalone — it would narrow the ClusterRole and break Phase 1+ tasks.
# Scheduled for removal in Batch 4 along with the rest of pipeline-uefi.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windows-image-pipeline
  namespace: windows-image-build
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windows-image-pipeline
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes", "datasources"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes/source"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: windows-image-pipeline
subjects:
  - kind: ServiceAccount
    name: windows-image-pipeline
    namespace: windows-image-build
roleRef:
  kind: ClusterRole
  name: windows-image-pipeline
  apiGroup: rbac.authorization.k8s.io
