apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: app-server-01
  namespace: team-a-vms
spec:
  instancetype:
    kind: VirtualMachineInstancetype
    name: windows-medium
    inferFromVolume: false
  preference:
    kind: VirtualMachinePreference
    name: win2022-golden
    inferFromVolume: false
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: app-server-01-rootdisk
      spec:
        source:
          pvc:
            namespace: vm-golden-images
            name: win2022-std-sysprep-20260414  # Replace with actual golden image PVC name
        storage:
          storageClassName: ocs-storagecluster-ceph-rbd-virtualization
          resources:
            requests:
              storage: 100Gi
  template:
    spec:
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: app-server-01-rootdisk
        - name: sysprep
          sysprep:
            configMap:
              name: win2022-sysprep
