apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: vyos-image-build-
  namespace: vyos-image-build
spec:
  pipelineRef:
    name: vyos-image-builder
  taskRunTemplate:
    serviceAccountName: vyos-image-pipeline
  timeouts:
    pipeline: "1h"
    tasks: "45m"
  params:
    - name: vyosIsoUrl
      value: "https://github.com/vyos/vyos-nightly-build/releases/download/2026.04.13-0034-rolling/vyos-2026.04.13-0034-rolling-generic-amd64.iso"
    - name: storageClass
      value: "ocs-storagecluster-ceph-rbd-virtualization"
    - name: goldenImageName
      value: "vyos-rolling"
    - name: rootDiskSize
      value: "4Gi"
