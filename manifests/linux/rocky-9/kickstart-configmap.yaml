apiVersion: v1
kind: ConfigMap
metadata:
  name: rocky-9-kickstart
  namespace: linux-image-build
data:
  ks.cfg: |
    #version=RHEL9
    text
    eula --agreed
    keyboard --vckeymap=us --xlayouts='us'
    lang en_US.UTF-8
    timezone Etc/UTC --utc
    network --bootproto=dhcp --device=link --activate --onboot=on
    rootpw --lock
    user --name=cloud-user --groups=wheel --plaintext --password=changeme123!
    selinux --enforcing
    firewall --enabled --service=ssh
    services --enabled=sshd,qemu-guest-agent,chronyd
    bootloader --append="rhgb quiet" --location=mbr
    zerombr
    clearpart --all --initlabel
    autopart --type=lvm

    # Rocky 9 boot ISO is package-less; pull from the public Rocky mirror
    url --url=https://download.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/
    repo --name=appstream --baseurl=https://download.rockylinux.org/pub/rocky/9/AppStream/x86_64/os/
    repo --name=extras --baseurl=https://download.rockylinux.org/pub/rocky/9/extras/x86_64/os/

    reboot --eject

    %packages
    @^minimal-environment
    @core
    chrony
    cloud-init
    qemu-guest-agent
    -plymouth
    %end

    %post --erroronfail
    # Allow cloud-user passwordless sudo (locked down on first boot in real estates)
    echo 'cloud-user ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/90-cloud-init-users
    chmod 0440 /etc/sudoers.d/90-cloud-init-users

    # Reset machine-id so cloned VMs get fresh IDs
    truncate -s 0 /etc/machine-id

    # Clean cloud-init so first boot triggers init
    cloud-init clean --logs --machine-id || true

    # Trim history & logs
    rm -f /root/.bash_history /home/cloud-user/.bash_history
    journalctl --rotate || true
    journalctl --vacuum-time=1s || true
    %end
