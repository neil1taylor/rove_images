apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: rocky-9-image-build-
  namespace: linux-image-build
spec:
  pipelineRef:
    name: rocky-9-image-builder
  taskRunTemplate:
    serviceAccountName: linux-image-pipeline
  timeouts:
    pipeline: "5h"
    tasks: "4h30m"
  params:
    # Rocky 9.7 boot ISO from a fast EU mirror (netcologne).
    # Last upstream point release as of pipeline-author's check; bump
    # the 9.x version when newer minor releases land.
    - name: rockyIsoUrl
      value: "https://mirror.netcologne.de/rocky/9.7/isos/x86_64/Rocky-9.7-x86_64-boot.iso"
    - name: storageClass
      value: "ocs-storagecluster-ceph-rbd-virtualization"
    - name: goldenImageName
      value: "rocky-9"
    - name: rootDiskSize
      value: "30Gi"
    - name: defaultInstancetype
      value: "u1.medium"
    - name: defaultPreference
      value: "centos.stream9"
