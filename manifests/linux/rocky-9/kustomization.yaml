apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linux-image-build
# pipelinerun.yaml is intentionally NOT in resources — it uses
# generateName which kustomize doesn't accept. Run it imperatively:
#   oc create -f manifests/linux/rocky-9/pipelinerun.yaml
resources:
  - pipeline-rbac.yaml
  - pipeline.yaml
